name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Versione
        id: ver
        run: |
          V=$(grep -oE "APP_VERSION = '[^']+'" app.js | cut -d"'" -f2)
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Compila APK
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Prepara file
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk rettifica.apk
          ls -la rettifica.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rettifica-apk
          path: rettifica.apk

      - name: Pubblica (Release «android»)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Rettifica Android ${{ steps.ver.outputs.name }}
          body: |
            APK per Android di Rettifica ${{ steps.ver.outputs.name }} (build ${{ github.run_number }}).
            Scarica **rettifica.apk** dal telefono e aprilo per installarlo.
          files: rettifica.apk
          make_latest: true
