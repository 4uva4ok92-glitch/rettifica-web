plugins {
    id 'com.android.application'
}

// The web app (index.html, *.js, fonts, icons…) lives in the repo root: copy it into the APK assets at build time,
// so the APK always contains the same version as the site.
def webRoot = rootProject.file('..')
def webOut = layout.buildDirectory.dir('generated/www')
tasks.register('copyWeb', Copy) {
    from(webRoot) {
        include '*.html', '*.js', '*.png', '*.jpg', '*.webmanifest', 'fonts/**', 'guide/**'
        exclude 'sw.js'
    }
    into webOut.map { it.dir('www') }
}

android {
    namespace 'it.rettifica.app'
    compileSdk 35

    defaultConfig {
        applicationId 'it.rettifica.webapp'
        minSdk 24
        targetSdk 35
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName System.getenv('VERSION_NAME') ?: '0.9.8'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('rettifica.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'rettifica'
            keyAlias 'rettifica'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: 'rettifica'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main.assets.srcDirs += webOut
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild') { dependsOn 'copyWeb' }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
